<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5b2a9e">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CAMP Admin">
<title>Mon CAMP · Admin</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f4f1f8;--card:#fff;--tx:#1d1530;--mu:#6d6482;--pr:#5b2a9e;--prs:#efe7fb;--bd:#e3dcee;--er:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#150f22;--card:#211833;--tx:#f1ecf9;--mu:#a99fc0;--pr:#a77bf0;--prs:#2f2350;--bd:#33284a;--er:#ff7b6b}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
h1{font-size:18px;margin:0;line-height:1.2}
.w{max-width:1120px;margin:0 auto;padding:0 clamp(12px,3vw,28px)}
.mu{color:var(--mu);font-size:13px}
.err{color:var(--er);font-size:14px;min-height:20px;margin:4px 0}
input{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:16px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
button{min-height:44px;padding:10px 16px;border:1px solid var(--pr);border-radius:12px;background:var(--pr);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:opacity .15s}
button:disabled{opacity:.55;cursor:wait}
button.g{background:transparent;color:var(--pr)}
@media(prefers-color-scheme:dark){button:not(.g){color:#150f22}.chips .chip{color:var(--mu)}.chips .chip[aria-pressed=true]{color:#150f22}}

/* Connexion */
.lg{min-height:100dvh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:26px 22px}
.box img{display:block;margin:0 auto 12px;border-radius:14px}
.box h1,.box>p{text-align:center}
.pw{position:relative}.pw input{padding-right:92px}
.pw button{position:absolute;right:4px;top:4px;min-height:38px;padding:6px 12px;border:0;background:transparent;color:var(--pr);font-weight:600}

/* En-tête */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
.top .w{display:flex;align-items:center;gap:10px;min-height:58px}
.top img{border-radius:9px}
.top h1{flex:1}
.top button{min-height:38px;padding:6px 12px}

/* Chiffres */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0 12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}
.k b{display:block;font-size:clamp(20px,5vw,26px);line-height:1.2;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px;margin:0 calc(-1*clamp(12px,3vw,28px));padding-inline:clamp(12px,3vw,28px)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:4px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--mu);font-size:13px;font-weight:500}
.chip[aria-pressed=true]{background:var(--pr);border-color:var(--pr);color:#fff}
@media(min-width:760px){.chips{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}}

/* Onglets + outils */
.seg{display:flex;background:var(--prs);border-radius:14px;padding:4px;margin:10px 0}
.seg button{flex:1;min-height:40px;border:0;background:transparent;color:var(--mu)}
.seg button[aria-selected=true]{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg i{font-style:normal;color:var(--pr);margin-left:4px}
@media(min-width:760px){.seg{display:inline-flex}.seg button{padding-inline:22px}}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.bar input{flex:1 1 220px}
.bar button{flex:1 1 auto}
@media(min-width:760px){.bar button{flex:0 0 auto}}

/* Liste */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px;align-items:start;padding-bottom:32px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;cursor:pointer}
.hd{display:flex;align-items:center;gap:12px}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--prs);color:var(--pr);display:grid;place-items:center;font-weight:700;font-size:14px}
.mn{flex:1;min-width:0}
.mn b,.mn span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv{flex:none;width:18px;height:18px;color:var(--mu);transition:transform .2s}
.card.open .cv{transform:rotate(180deg)}
.det{display:none;margin-top:10px;padding-top:8px;border-top:1px solid var(--bd);font-size:13px}
.card.open .det{display:block}
.det div{display:flex;justify-content:space-between;gap:14px;padding:3px 0}
.det span:first-child{color:var(--mu);flex:none}
.det span:last-child{text-align:right;overflow-wrap:anywhere}
.empty{grid-column:1/-1;text-align:center;padding:36px 12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="lg" id="login">
  <form class="box" id="lf" novalidate>
    <img src="icons/icon.svg" width="60" height="60" alt="">
    <h1>Mon CAMP · Admin</h1>
    <p class="mu">Accès réservé à l'administrateur.</p>
    <label for="em">E-mail</label>
    <input id="em" type="email" autocomplete="username" inputmode="email" autocapitalize="none" required>
    <label for="pw">Mot de passe</label>
    <div class="pw"><input id="pw" type="password" autocomplete="current-password" required><button type="button" id="eye" class="g">Afficher</button></div>
    <div class="err" id="lerr" role="alert"></div>
    <button id="go" type="submit" style="width:100%">Se connecter</button>
  </form>
</main>

<div id="app" hidden>
  <header class="top"><div class="w">
    <img src="icons/icon.svg" width="32" height="32" alt="">
    <h1>Mon CAMP · Admin</h1>
    <button class="g" id="out">Déconnexion</button>
  </div></header>
  <div class="w">
    <section class="kpi" id="kpi" aria-label="Chiffres clés"></section>
    <div class="chips" id="chips" aria-label="Filtrer par groupe"></div>
    <div class="seg" role="tablist">
      <button role="tab" id="t1" aria-selected="true">Inscrits<i id="c1">0</i></button>
      <button role="tab" id="t2" aria-selected="false">Sans inscription<i id="c2">0</i></button>
    </div>
    <div class="bar">
      <input id="q" type="search" placeholder="Rechercher : nom, téléphone, groupe, ticket" aria-label="Rechercher">
      <button class="g" id="re">Actualiser</button>
      <button class="g" id="csv">Exporter CSV</button>
    </div>
    <div class="mu" id="upd"></div>
    <div class="err" id="aerr" role="alert"></div>
    <div class="list" id="list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://pzxpjavylrsmptwjeupi.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6eHBqYXZ5bHJzbXB0d2pldXBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTU1ODMsImV4cCI6MjEwNjQ5MTU4M30.DeuASRJAaTuMhrSaF5N0SHfo-4E5r_c_wiugheIFiN0');
const $=id=>document.getElementById(id);
let reg=[],orph=[],tab=1,grp='',cur=[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('fr-FR');
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const LBL={ticket_id:'Ticket',name:'Nom',phone:'Téléphone',birth:'Naissance',sex:'Sexe',branch:'Branche',grade:'Grade',region:'Région',group_name:'Groupe',troop:'Troupe',patrol:'Patrouille',title:'Titre',sector:'Secteur',price:'Prix',pass:'Pass',church:'Église',address:'Adresse',contact_email:'E-mail',birth_place:'Lieu de naissance',nationality:'Nationalité',created_at:'Créé le'};
const CHEV='<svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

function busy(b,on,label){if(on){b.dataset.t=b.textContent;b.textContent=label}else if(b.dataset.t){b.textContent=b.dataset.t}b.disabled=on}

async function enter(){
  const {data:ok,error}=await sb.rpc('camp_admin');
  if(error||!ok){await sb.auth.signOut();$('lerr').textContent="Ce compte n'est pas administrateur.";return false}
  $('login').hidden=true;$('app').hidden=false;load();return true;
}
$('eye').onclick=()=>{const p=$('pw'),s=p.type==='password';p.type=s?'text':'password';$('eye').textContent=s?'Masquer':'Afficher'};
$('lf').onsubmit=async e=>{
  e.preventDefault();$('lerr').textContent='';
  const email=$('em').value.trim(),pw=$('pw').value;
  if(!email||!pw){$('lerr').textContent='Saisissez votre e-mail et votre mot de passe.';return}
  busy($('go'),true,'Connexion…');
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){$('lerr').textContent='Connexion refusée : '+error.message}else{await enter()}
  busy($('go'),false);
};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(({data})=>{if(data.session)enter()});

async function load(){
  $('aerr').textContent='';busy($('re'),true,'Chargement…');
  const [r,p]=await Promise.all([
    sb.from('registrations').select('*').order('created_at',{ascending:false}),
    sb.from('profiles').select('*').order('created_at',{ascending:false})]);
  busy($('re'),false);
  if(r.error||p.error){$('aerr').textContent='Erreur : '+(r.error||p.error).message+'. Vérifiez votre connexion puis actualisez.';return}
  reg=r.data;const ids=new Set(reg.map(x=>x.user_id));
  orph=p.data.filter(x=>!ids.has(x.id));
  const rev=reg.reduce((s,x)=>s+(Number(x.price)||0),0);
  const k=(v,l)=>'<div class="k"><b>'+v+'</b><span class="mu">'+l+'</span></div>';
  $('kpi').innerHTML=k(fmt(reg.length),'Inscrits')+k(fmt(orph.length),'Sans inscription')+k(fmt(rev)+' F','Recettes');
  $('c1').textContent=reg.length;$('c2').textContent=orph.length;
  const g={};reg.forEach(x=>{const n=x.group_name||'—';g[n]=(g[n]||0)+1});
  const chip=(n,l)=>'<button class="chip" data-g="'+esc(n)+'" aria-pressed="'+(grp===n)+'">'+esc(l)+'</button>';
  $('chips').innerHTML=chip('','Tous')+Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([n,v])=>chip(n,n+' : '+v)).join('');
  $('upd').textContent='Mis à jour à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  draw();
}
function draw(){
  const q=$('q').value.toLowerCase().trim();
  const src=tab===1?reg:orph;
  cur=src.filter(x=>(!grp||(x.group_name||'—')===grp)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q)));
  $('list').innerHTML=cur.length?cur.map(x=>{
    const t=tab===1?(x.ticket_id||x.ticket_code||'—'):'';
    const sub=[t,x.phone,x.group_name,tab===1&&x.price!=null?fmt(x.price)+' F':''].filter(Boolean).join(' · ');
    const det=Object.keys(LBL).filter(k=>x[k]!=null&&x[k]!=='').map(k=>'<div><span>'+LBL[k]+'</span><span>'+esc(x[k])+'</span></div>').join('');
    return '<div class="card" tabindex="0" role="button" aria-expanded="false"><div class="hd"><span class="av">'+esc(ini(x.name))+'</span><div class="mn"><b>'+esc(x.name||'(sans nom)')+'</b><span class="mu">'+esc(sub)+'</span></div>'+CHEV+'</div><div class="det">'+(det||'<span class="mu">Aucun détail</span>')+'</div></div>';
  }).join(''):'<p class="mu empty">'+(src.length?'Aucun résultat. Modifiez la recherche ou le filtre de groupe.':(tab===1?'Aucune inscription pour le moment.':'Tous les comptes ont une inscription.'))+'</p>';
}
const toggle=c=>c.setAttribute('aria-expanded',c.classList.toggle('open'));
$('list').onclick=e=>{const c=e.target.closest('.card');if(c)toggle(c)};
$('list').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();toggle(e.target)}};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;grp=b.dataset.g;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));draw()};
const setTab=n=>{tab=n;$('t1').setAttribute('aria-selected',n===1);$('t2').setAttribute('aria-selected',n===2);draw()};
$('t1').onclick=()=>setTab(1);$('t2').onclick=()=>setTab(2);
let tm;$('q').oninput=()=>{clearTimeout(tm);tm=setTimeout(draw,150)};
$('re').onclick=load;
$('csv').onclick=()=>{
  if(!cur.length){$('aerr').textContent='Aucune ligne à exporter.';return}
  $('aerr').textContent='';
  const cols=['ticket_id','name','phone','birth','sex','branch','grade','region','group_name','troop','patrol','title','sector','price','church','contact_email','created_at'];
  const line=a=>a.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';');
  const csv='\ufeff'+[line(cols)].concat(cur.map(x=>line(cols.map(c=>x[c])))).join('\n');
  const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=u;
  a.download=(tab===1?'inscrits':'sans-inscription')+'-mon-camp-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);
};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
